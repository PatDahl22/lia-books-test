services:
  - type: web
    name: lia-books-test
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: BookQuote.Api
      - key: Jwt__Audience
        value: BookQuote.Frontend
      - key: DatabaseUrl
        fromDatabase:
          name: lia-books-db
          property: connectionString

databases:
  - name: lia-books-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: lia_books
    user: lia_books_user
