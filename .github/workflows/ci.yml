name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.317
      - name: Restore
        run: dotnet restore backend/BookQuote.Api.Tests/BookQuote.Api.Tests.csproj
      - name: Build
        run: dotnet build backend/BookQuote.Api.Tests/BookQuote.Api.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test backend/BookQuote.Api.Tests/BookQuote.Api.Tests.csproj --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false --browsers=ChromeHeadless
